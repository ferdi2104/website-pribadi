    <text x="20" y="55" font-family="monospace" font-size="12" fill="#22c55e">def calculate_total(items):</text>
    <text x="40" y="75" font-family="monospace" font-size="12" fill="#93c5fd">total = 0</text>
    <text x="40" y="95" font-family="monospace" font-size="12" fill="#93c5fd">for item in items:</text>
    <text x="60" y="115" font-family="monospace" font-size="12" fill="#fbbf24">total += item.price * item.qty</text>
    <text x="40" y="135" font-family="monospace" font-size="12" fill="#93c5fd">return total</text>
    <text x="20" y="160" font-family="monospace" font-size="12" fill="#22c55e"># Result: Rp 2.500.000</text>
    <text x="20" y="185" font-family="monospace" font-size="12" fill="#a78bfa">print(f"Total: {calculate_total(orders)}")</text>
